{% extends "base.html" %}

{% block title %}工作台 · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container pp-container">

  <div class="pp-page-header">
    <div class="pp-page-header__main">
      <h1 class="pp-page-title">工作台</h1>
    </div>
  </div>

  <div class="pp-surface">
    <div class="pp-surface__header">
      <h2 class="pp-section-title">从哪里开始</h2>
    </div>
    <div class="pp-surface__body">
      <div class="pp-entry-grid">
        {% for entry in entries %}
          <a class="pp-entry {% if entry.primary %}pp-entry--primary{% endif %}"
             href="{{ entry.url }}">
            <span class="pp-entry__label">{{ entry.label }}</span>
            <svg class="pp-entry__arrow" width="16" height="16" viewBox="0 0 24 24"
                 fill="none" aria-hidden="true" focusable="false">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        {% endfor %}
      </div>

      {# 运维类入口只给超级管理员：普通成员不需要"服务状态"这类信息 #}
      {% if user.is_superuser %}
        <div class="pp-home-links">
          <a href="/admin/">后台管理</a>
          <a href="{% url 'core:health_live' %}">服务状态</a>
        </div>
      {% endif %}
    </div>
  </div>

</div>
{% endblock %}
