# ============================================================================
# docker-compose —— 可复现的本地/生产运行编排
#
#   docker compose up -d            启动 app + db
#   docker compose logs -f app      查看应用日志
#   docker compose down             停止（数据保留在卷里）
#
# 安全设计：
#   * db 只加入内部网络，**不发布** 5432 到宿主机 → 公网与宿主机都无法直连
#   * app 的 8000 也只在内部网络；对外由 Nginx（或反向代理）接入
#   * 所有敏感值来自 .env（已 gitignore），compose 里不写死任何密钥
# ============================================================================

services:
  db:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?必须设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?必须设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      # 初始化参数：UTF8 + 合理时区
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend          # 仅内部网络
    # 刻意不映射端口：数据库不对外暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy     # 等数据库真正可用再启动
    env_file:
      - .env                            # 敏感配置来自 .env（不进仓库）
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # 容器内通过服务名访问数据库
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # 由反向代理终止 TLS，因此容器内不强制跳转 HTTPS
      DJANGO_HTTPS_ENABLED: "${DJANGO_HTTPS_ENABLED:-true}"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - applogs:/app/logs
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/pingpong.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  static:
  media:
  applogs:

networks:
  # 数据库只连这条；它不与外界互通
  backend:
    internal: true
  # 反向代理与应用对外这一层
  frontend:
