# ============================================================================
# docker-compose —— 可复现的本地/生产运行编排
#
#   docker compose up -d            启动 app + db
#   docker compose logs -f app      查看应用日志
#   docker compose down             停止（数据保留在卷里）
#
# 安全设计：
#   * db 只加入内部网络，**不发布** 5432 到宿主机 → 公网与宿主机都无法直连
#   * app 的 8000 也只在内部网络；对外由 Nginx（或反向代理）接入
#   * 所有敏感值来自 .env（已 gitignore），compose 里不写死任何密钥
# ============================================================================

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?必须设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?必须设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      # 初始化参数：UTF8 + 合理时区
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Shanghai
    volumes:
      # P5：数据库数据同样放在宿主机持久化数据目录下（与附件同根），
      # 备份时整个目录打包即可，迁移服务器也只搬这一个目录。
      # PostgreSQL 18+ 的 PGDATA 位于 /var/lib/postgresql/18/docker，
      # 官方镜像要求挂载上一级目录；挂到旧版 /data 路径不会被实际使用。
      - ${PINGPONG_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    networks:
      - backend          # 仅内部网络
    # 刻意不映射端口：数据库不对外暴露
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy     # 等数据库真正可用再启动
    env_file:
      - .env                            # 敏感配置来自 .env（不进仓库）
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # 容器健康检查使用 127.0.0.1 作为 Host。生产域名仍由 .env 提供，
      # 这里只额外把回环地址加入允许列表，不扩大公网入口。
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?必须设置 DJANGO_ALLOWED_HOSTS},127.0.0.1"
      # 容器内通过服务名访问数据库
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # 由反向代理终止 TLS，因此容器内不强制跳转 HTTPS
      DJANGO_HTTPS_ENABLED: "${DJANGO_HTTPS_ENABLED:-true}"
      # app 端口只在 Docker 内部网络，可信代理头由 Nginx 覆盖后传入。
      TRUST_PROXY_HEADERS: "true"
      # P5：私有附件存储后端。生产默认 local（服务器本地持久化磁盘），
      # 附件目录必须显式配置（见下方 PRIVATE_MEDIA_ROOT），
      # 否则启动时构造存储会报错 —— 防止忘了挂持久卷、附件写进容器临时层。
      # 若日后改用对象存储，设为 cos 并补齐 COS_* 四项凭据即可。
      PRIVATE_STORAGE_BACKEND: "${PRIVATE_STORAGE_BACKEND:-local}"
      # 容器内的数据根目录，由下方 bind mount 映射到宿主机持久化路径
      PRIVATE_MEDIA_ROOT: "/data/private_media"
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      # P5：私有附件目录。必须落在宿主机持久化磁盘上，容器重建不丢数据。
      # 指向由 PINGPONG_DATA_DIR 决定的数据目录（见文件末尾说明）。
      - ${PINGPONG_DATA_DIR:-./data}/private_media:/data/private_media
      - applogs:/app/logs
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      # 官方 Nginx 镜像会把模板中的 ${DOMAIN} 替换为 .env 中的裸域名。
      DOMAIN: "${DOMAIN:?必须设置 DOMAIN（不带 https://）}"
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/pingpong.conf:/etc/nginx/templates/default.conf.template:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
      # 注意：私有附件**不**给 nginx 挂载 —— 它必须经过 Django 鉴权后下发，
      # 不能像 static/media 那样被反代直接服务。

      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  static:
  media:
  applogs:
# 说明（P5 数据落盘策略）：
#   pgdata 与 private_media 均由具名卷改为 **宿主机目录 bind mount**，
#   位置由 .env 里的 PINGPONG_DATA_DIR 决定，例如：
#     Linux 服务器 ：PINGPONG_DATA_DIR=/srv/pingpong-data
#     Windows 本地 ：PINGPONG_DATA_DIR=E:/乒乓数据
#   （compose 的插值使用正斜杠更稳妥；Windows 下盘符路径可正常识别）
#
#   为什么不用具名卷：具名卷藏在 Docker 的存储目录里，备份、迁移、
#   人工核对都得绕一层 docker volume 命令；而项目需求是「数据都存在一个
#   明确的目录里」。用 bind mount 后：
#     · 备份 = 打包该目录
#     · 迁移 = 复制该目录
#     · 附件与数据库同根，恢复时不会顾此失彼
#   代价是该目录的属主/权限需要预先设置（db 容器以 postgres 用户写入），
#   部署文档里给出了创建与授权命令。
#
#   注意：nginx **不**挂载 private_media —— 私有附件必须经 Django 鉴权后下发，
#   不能像 static/media 那样被反向代理直接服务。

networks:
  # 数据库只连这条；它不与外界互通
  backend:
    internal: true
  # 反向代理与应用对外这一层
  frontend:
