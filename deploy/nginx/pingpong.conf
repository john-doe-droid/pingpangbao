# ============================================================================
# Nginx 反向代理配置（生产）
#
# 使用方式：把本文件放到 /etc/nginx/conf.d/pingpong.conf，
#          把 stat.example.com 替换为真实域名，然后
#          nginx -t && systemctl reload nginx
#
# 设计要点：
#   1. 对外只暴露 80/443，应用端口（8000）不发布到宿主机公网；
#   2. 静态资源由 Nginx 直接读共享卷，不经 Python 进程；
#   3. 透传 X-Forwarded-Proto/For，使 Django 能正确判断 HTTPS 与真实客户端 IP；
#   4. 只允许应用与运维访问数据库（数据库本身不发布端口，见 docker-compose.yml）。
# ============================================================================

upstream pingpong_app {
    # app 是 docker-compose 里的服务名，由 Docker 内部 DNS 解析
    server app:8000 fail_timeout=30s;
}

# HTTP：仅用于 ACME 挑战与跳转到 HTTPS
server {
    listen 80;
    server_name stat.example.com;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stat.example.com;

    # --- 证书（由 certbot 生成；路径按实际替换）---
    ssl_certificate     /etc/letsencrypt/live/stat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stat.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    # 请求体上限。
    # P3 起支持视频上传（单文件上限 300 MiB），因此这里必须大于该值；
    # 取 320m 留出 multipart 边界与表单字段的余量。
    # 注意：这个值必须 ≥ 应用侧 UPLOAD_VIDEO_MAX_BYTES，否则大文件会在
    # 反代层就被 413 拒绝，用户看到的错误与应用校验无关、难以排查。
    client_max_body_size 320m;

    # 大文件上传/下载需要更长的代理超时，否则 300 MiB 视频容易中途断开
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # --- 静态资源：直接由 Nginx 服务 ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- 健康检查：不写访问日志，避免刷屏 ---
    location /health/ {
        proxy_pass http://pingpong_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- 应用：全部转发给 Gunicorn ---
    location / {
        proxy_pass http://pingpong_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django 依赖这一项判断原始协议（SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
