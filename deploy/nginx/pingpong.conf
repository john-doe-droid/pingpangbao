# ============================================================================
# Nginx 反向代理配置（生产）
#
# 使用方式：Docker Compose 会把本文件挂到官方 Nginx 镜像的模板目录，
#          并用 .env 中的 DOMAIN 替换 ${DOMAIN}。不要在此写死真实域名。
#
# 设计要点：
#   1. 对外只暴露 80/443，应用端口（8000）不发布到宿主机公网；
#   2. 静态资源由 Nginx 直接读共享卷，不经 Python 进程；
#   3. 透传 X-Forwarded-Proto/For，使 Django 能正确判断 HTTPS 与真实客户端 IP；
#   4. 只允许应用与运维访问数据库（数据库本身不发布端口，见 docker-compose.yml）。
# ============================================================================

upstream pingpong_app {
    # app 是 docker-compose 里的服务名，由 Docker 内部 DNS 解析
    server app:8000 fail_timeout=30s;
}

# 统一限制登录接口的请求频率；应用层还会按账号做失败锁定。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# HTTP：仅用于 ACME 挑战与跳转到 HTTPS
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stat.example.com;

    # --- 证书（由 certbot 生成；路径按实际替换）---
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 安全响应头 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # 请求体上限。
    # 单次提交总量上限为 100 MiB，这里留出 multipart 余量。
    client_max_body_size 110m;

    # 文件上传/下载需要更长的代理超时
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # --- 静态资源：直接由 Nginx 服务 ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- 健康检查：不写访问日志，避免刷屏 ---
    location /health/ {
        proxy_pass http://pingpong_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- 应用：全部转发给 Gunicorn ---
    location ~ ^/(accounts|admin)/login/ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://pingpong_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://pingpong_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 覆盖客户端自带值，避免伪造审计 IP。
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Django 依赖这一项判断原始协议（SECURE_PROXY_SSL_HEADER）
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
